<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>lo1 shop</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 3rem auto; padding: 0 1rem; }
      li { display: flex; justify-content: space-between; padding: 0.5rem 0; border-bottom: 1px solid #ddd; }
      .error { color: #b00020; }
    </style>
  </head>
  <body>
    <h1>lo1 shop</h1>
    <p>Products below come from Postgres, through the API, over HTTPS.</p>
    <ul id="products"><li>Loading…</li></ul>
    <script>
      const list = document.getElementById("products");
      fetch("__API_URL__/products")
        .then((res) => res.json())
        .then((products) => {
          list.innerHTML = products
            .map((p) => `<li><span>${p.name}</span><span>£${(p.price_pence / 100).toFixed(2)}</span></li>`)
            .join("");
        })
        .catch((err) => {
          list.innerHTML = `<li class="error">Could not reach the API: ${err.message}</li>`;
        });
    </script>
  </body>
</html>
