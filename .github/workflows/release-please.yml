name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish-only:
        description: Skip release-please and run publish directly
        type: boolean
        default: false

jobs:
  release-please:
    if: ${{ !(inputs.publish-only || false) }}
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: |
      always() &&
      (inputs.publish-only || needs.release-please.outputs.releases_created == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Copy LICENSE into packages
        run: |
          for pkg in packages/sdk packages/cli plugins/celerity; do
            cp LICENSE "$pkg/LICENSE"
          done

      - name: Resolve workspace dependencies
        run: |
          SDK_VERSION=$(jq -r .version packages/sdk/package.json)
          for pkg in packages/cli plugins/celerity; do
            tmp=$(mktemp)
            jq --arg v "$SDK_VERSION" \
              '.dependencies["@lo1/sdk"] = $v' \
              "$pkg/package.json" > "$tmp"
            mv "$tmp" "$pkg/package.json"
          done

      # Uses npm trusted publishing: npm swaps this job's OIDC token
      # (id-token: write) for a short-lived publish token, so no npm token is
      # stored or needed. A version that's already on npm is skipped, so a
      # failed release can be finished with a publish-only run.
      - name: Publish packages
        run: |
          for pkg in packages/sdk packages/cli plugins/celerity; do
            name=$(jq -r .name "$pkg/package.json")
            version=$(jq -r .version "$pkg/package.json")
            if npm view "$name@$version" version >/dev/null 2>&1; then
              echo "$name@$version is already on npm, skipping"
              continue
            fi
            (cd "$pkg" && npm publish --access public --provenance)
          done
